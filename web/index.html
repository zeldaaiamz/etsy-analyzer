<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>选品雷达 · Etsy → Amazon</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">◆</span> 选品雷达 <span class="brand-sub">Etsy → Amazon US</span></div>
  <div id="userBox" class="user hidden"><span id="demoBadge" class="pill pill-warn hidden">演示数据</span><span id="who" class="muted"></span><button id="btnLogout" class="btn btn-ghost btn-sm">退出</button></div>
</header>

<main class="container">
  <section id="login" class="login-wrap hidden">
    <div class="card login-card">
      <div class="logo logo-lg">◆</div>
      <h1>登录选品雷达</h1>
      <p class="muted">输入邮箱，我们会发送一个一次性登录链接</p>
      <input id="email" class="input" type="email" placeholder="you@example.com" autocomplete="email">
      <button id="btnLogin" class="btn btn-primary btn-block">发送登录链接</button>
      <p id="loginMsg" class="hint"></p>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="card composer">
      <div class="composer-head">
        <div><h2>新建分析</h2><p class="muted">每行粘贴一个 Etsy 商品链接，系统会逐条识别产品、人群并搜索亚马逊同款与类似品</p></div>
      </div>
      <textarea id="urls" class="input textarea" placeholder="https://www.etsy.com/listing/1234567890/..."></textarea>
      <div class="composer-foot"><span id="urlCount" class="muted">0 条有效链接</span>
        <span class="spacer"></span><span id="submitMsg" class="hint"></span>
        <button id="btnSubmit" class="btn btn-primary">开始分析 →</button></div>
    </div>

    <div class="section-head"><h2>分析结果</h2><div id="stats" class="stats"></div></div>
    <div id="list" class="list"></div>
  </section>
</main>

<div id="lightbox" class="lightbox hidden"><img id="lbImg" alt=""><p id="lbCap"></p></div>

<div id="drawerMask" class="mask hidden"></div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head"><div id="drawerTitle" class="drawer-title"></div><button class="icon-btn" id="drawerClose" aria-label="关闭">✕</button></div>
  <div id="drawerBody" class="drawer-body"></div>
</aside>
<script type="module" src="js/app.js"></script>
</body>
</html>
