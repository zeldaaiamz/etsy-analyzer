<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etsy → Amazon 选品分析</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<h1>Etsy → Amazon US 选品分析</h1>
<section id="login">
  <input id="email" type="email" placeholder="邮箱"> <button id="btnLogin">发送登录链接</button>
  <p id="loginMsg"></p>
</section>
<section id="app" class="hidden">
  <p>已登录：<span id="who"></span> <button id="btnLogout">退出</button></p>
  <textarea id="urls" placeholder="每行粘贴一个 Etsy 商品链接，例如 https://www.etsy.com/listing/1234567890/..."></textarea>
  <button id="btnSubmit">提交分析</button> <span id="submitMsg"></span>
  <table>
    <thead><tr><th>图片</th><th>状态</th><th>产品</th><th>目标人群</th><th>搜索词</th>
      <th>竞争</th><th>需求</th><th>机会分</th><th>结论</th><th>亚马逊证据</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</section>

<div id="lightbox" class="overlay hidden"><img id="lbImg" alt=""><p id="lbCap"></p></div>

<div id="detail" class="overlay hidden">
  <div class="panel">
    <button class="close" id="detailClose" aria-label="关闭">×</button>
    <div id="detailBody"></div>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
